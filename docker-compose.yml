# MenyaMuhinzi local infrastructure.
#   docker compose up -d postgres redis   -> start only the databases (default)
#   docker compose --profile app up -d    -> also build and run the API container
# Credentials are read from `.env` (copy `.env.example`); nothing is hardcoded here.

name: menyamuhinzi

services:
  postgres:
    image: postgres:17-alpine
    container_name: menyamuhinzi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: menyamuhinzi-redis
    restart: unless-stopped
    # noeviction is required by BullMQ so queued jobs are never silently dropped.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menyamuhinzi-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      LOG_PRETTY: 'false'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '${APP_PORT:-4000}:${APP_PORT:-4000}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
